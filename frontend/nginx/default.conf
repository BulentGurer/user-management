server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Do not reveal the nginx version in headers and error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API, including the Swagger UI at /api/docs. "^~" stops nginx from
    # also checking the regex locations below, which would otherwise catch
    # Swagger's .js and .css files. The URI is passed on unchanged (no
    # trailing slash in proxy_pass), so /api stays in the path.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # The client's address, for the login rate limit. nginx appends the
        # address it sees; the API trusts exactly one proxy hop (this one).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build output with a content hash in the file name: cache for a year.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else is an Angular route: serve index.html and let the
    # router decide. It is never cached, so a new release shows up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
