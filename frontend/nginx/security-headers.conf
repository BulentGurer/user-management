# Security headers for the web app. Included in every location that sets its
# own headers, because nginx drops inherited add_header lines in that case.
# The API sets its own headers (helmet).

# Only this origin may provide scripts, styles, fonts, images and API calls.
# Inline styles are allowed because Angular adds component styles as <style>
# elements; inline scripts are not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
